[project]
name = "astra-backend"
version = "0.1.0"
description = "Astra web data query task runner backend"
requires-python = ">=3.10"
dependencies = [
  "aiosqlite>=0.19.0",
  "alembic>=1.13.0",
  "asyncpg>=0.29.0",
  "charset-normalizer>=3.3.0",
  "croniter>=6.0.0,<7.0.0",
  "fastapi>=0.110.0",
  "httpx[http2]>=0.27.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "PyYAML>=6.0.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "trafilatura>=2.0.0,<3.0.0",
  "uvicorn[standard]>=0.27.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.domain.agent_profile" = ["*.md"]
"app.infrastructure.builtin_skills" = ["**/*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.4.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 128
target-version = "py310"

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
  "C4",
  "PIE",
  "PGH",
  "RUF006",
  "RUF012",
  "RUF100",
]
ignore = ["B008", "C417"]
